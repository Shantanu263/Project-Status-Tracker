<!-- Navbar -->
<nav class="fixed top-0 left-0 right-0 bg-[#8c2d1b] backdrop-blur-md border-b border-gray-200/50 z-50 h-20">
  <div class="h-full px-8">
    <div class="flex items-center justify-between h-full">
      <!-- Left: Toggle Button + Logo -->
      <div class="flex items-center space-x-4">
        <button (click)="toggleSidebar()" class="p-2 text-white hover:bg-white/20 rounded-lg transition-colors duration-200">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
        <div class="font-bold text-lg text-white">ProjectHub</div>
      </div>

      <!-- Right: Actions -->
      <div class="flex items-center space-x-6">
        <!-- New Project Button -->
        <button (click)="createProject()" class="flex items-center px-4 py-2 bg-white text-[#8c2d1b] rounded-lg hover:bg-gray-200 transition-colors duration-200 font-medium shadow-sm">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          Create
        </button>

        <!-- Notifications Bell -->
        <div class="relative">
          <button class="relative p-2 text-white hover:bg-white/20 rounded-lg transition-colors duration-200">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
            </svg>
            <!-- Notification Badge -->
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>
        </div>

        <!-- User Profile Dropdown -->
        <div class="relative group">
          <button class="flex items-center space-x-2 p-2 hover:bg-white/20 rounded-lg transition-colors duration-200">
            <div class="w-9 h-9 bg-[#8c2d1b] rounded-full flex items-center justify-center text-white font-semibold">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
  </svg>
            </div>
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>

          <!-- Dropdown Menu -->
          <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200">
            <div class="py-2">
              <a href="#" class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-100 transition-colors duration-200">
                <svg class="w-5 h-5 mr-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                Profile
              </a>
              <a href="#" class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-100 transition-colors duration-200">
                <svg class="w-5 h-5 mr-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                Settings
              </a>
              <hr class="my-2 border-gray-200">
              <a href="#" class="flex items-center px-4 py-2 text-red-600 hover:bg-red-50 transition-colors duration-200">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                Logout
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Sidebar -->
<aside class="fixed top-20 left-0 h-[calc(100vh-5rem)] w-64 bg-white shadow-lg border-r-2 border-gray-200 transition-transform duration-300 z-40" [class.-translate-x-full]="!sidebarOpen()">
  <div class="flex flex-col h-full">
    <!-- Projects Section -->
    <div class="flex-1 overflow-y-auto px-4 py-6">
      <div class="flex items-center justify-between mb-4 px-2">
        <h2 class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Projects</h2>
        <button (click)="createProject()" class="p-1.5 rounded-md bg-[#8c2d1b] text-white hover:bg-[#6b2115]" aria-label="Create Project">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
        </button>
      </div>
      
      <nav class="space-y-1">
        @for (project of projects(); track project.projectId) {
          <button
            (click)="selectProject(project)"
            [class.bg-[#8c2d1b]]="selectedProjectId() === project.projectId"
            [class.text-white]="selectedProjectId() === project.projectId"
            [class.text-gray-700]="selectedProjectId() !== project.projectId"
            class="w-full text-left flex items-center px-4 py-3 rounded-lg hover:bg-gray-100 transition-all duration-200 group"
          >
            <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
            </svg>
            <span class="font-medium truncate">{{ project.projectName }}</span>
          </button>
        }
      </nav>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-200">
      <div class="flex items-center text-gray-700 text-sm">
        <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <span>{{ user().name }}</span>
      </div>
    </div>
  </div>
</aside>
