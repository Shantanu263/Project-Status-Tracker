<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Overdue Item</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f8; padding: 20px;">
<table width="100%" cellpadding="0" cellspacing="0">
  <tr>
    <td align="center">
      <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 6px; overflow: hidden;">

        <!-- Header -->
        <tr>
          <td style="background-color: #dc2626; padding: 16px;">
            <h2 style="margin: 0; color: #ffffff; font-weight: 600;">
              <table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
                <tr>
                  <td style="padding-right: 8px; vertical-align: middle;">
                    <img
                            src="https://cdn-icons-png.flaticon.com/512/1828/1828843.png"
                            alt="Alert"
                            width="18"
                            height="18"
                            style="display: block;"
                    />
                  </td>
                  <td style="vertical-align: middle; white-space: nowrap;">
                    Overdue Item
                  </td>
                </tr>
              </table>
            </h2>
          </td>
        </tr>

        <!-- Body -->
        <tr>
          <td style="padding: 20px; color: #374151;">
            <p>Hello <strong>[USER_NAME]</strong>,</p>

            <p>
              The following <strong>[ENTITY_TYPE]</strong> is now <strong style="color: #dc2626;">overdue</strong>:
            </p>

            <table width="100%" style="margin-top: 12px; margin-bottom: 12px;">
              <tr>
                <td><strong>Project:</strong></td>
                <td>[PROJECT_NAME]</td>
              </tr>
              <tr>
                <td><strong>[ENTITY_TYPE]:</strong></td>
                <td>[ENTITY_NAME]</td>
              </tr>
              <tr>
                <td><strong>Due Date:</strong></td>
                <td>[END_DATE]</td>
              </tr>
<!--              <tr>-->
<!--                <td><strong>Days Overdue:</strong></td>-->
<!--                <td>[DELAY]</td>-->
<!--              </tr>-->
            </table>

            <p>
              Immediate attention is required to bring this item back on track.
            </p>

            <p style="margin-top: 24px;">
              <a href="http://localhost:4200"
                 style="background-color: #dc2626; color: #ffffff; padding: 10px 16px; text-decoration: none; border-radius: 4px;">
                Go To Portal
              </a>
            </p>

            <p style="margin-top: 32px; font-size: 13px; color: #6b7280;">
              This is an automated alert from Project Status Tracker.
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
